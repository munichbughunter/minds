[package]
name = "minds-cli"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
minds-core = { path = "../minds-core" }
minds-capture = { path = "../minds-capture" }
minds-redact = { path = "../minds-redact" }
minds-store = { path = "../minds-store" }
minds-git = { path = "../minds-git" }
minds-reader = { path = "../minds-reader" }
minds-metrics = { path = "../minds-metrics" }
minds-gitlab = { path = "../minds-gitlab" }
minds-attest = { path = "../minds-attest" }
minds-tui = { path = "../minds-tui", optional = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }

# Nur für `setsid` im losgelösten Sync (#85) — ohnehin transitiv über gix im
# Graphen, hier nur noch direkt benannt.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `tui` ist Default der Release-Builds; `--no-default-features` baut die
# Kern-CLI ohne Oberfläche (und ohne ratatui/crossterm im Binary).
[features]
default = ["tui"]
tui = ["dep:minds-tui"]

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[[bin]]
name = "minds"
path = "src/main.rs"
