[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/munichbughunter/minds"

# Zentrale Verwaltung. Crates erben per `x.workspace = true`. 
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
anyhow = "1"
gix = { version = "0.85", features = ["tree-editor", "blame"] }
clap = { version = "4", features = ["derive"] }
aho-corasick = "1"
regex = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
