[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/munichbughunter/minds"

# Zentrale Verwaltung. Crates erben per `x.workspace = true`. 
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
thiserror = "2"
anyhow = "1"
gix = { version = "0.85", features = ["tree-editor", "blame"] }
clap = { version = "4", features = ["derive"] }
aho-corasick = "1"
regex = "1"
tempfile = "3"
# Ohne Default-Features: kein termwiz/termion/palette/serde — nur das
# crossterm-Backend in genau der hier gepinnten crossterm-Version.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
terminal_size = "0.4"
textwrap = "0.16"
libc = "0.2"
# Zeitstempel-Typ für `gix::index::State::from_bytes` (EA-08); über
# gix-index ohnehin im Graphen.
filetime = "0.2"
# Datei-Beobachter des Witness (EA-08). Linux: inotify (reines Rust + libc,
# musl-tauglich), macOS: FSEvents. Keine weiteren Default-Features.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
